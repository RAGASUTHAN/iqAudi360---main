<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — iqAudi360</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style>
    .auth-page {
      display: flex;
      min-height: 100vh;
      width: 100vw;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 60%), #080c14;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(14, 21, 36, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.1);
      backdrop-filter: blur(16px);
      position: relative;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #00d2ff 0%, #8b5cf6 100%);
      color: #030712;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 14px;
    }
    .auth-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .auth-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .auth-label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .auth-input {
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .auth-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2);
    }
    .auth-btn-primary {
      background: linear-gradient(135deg, #00d2ff 0%, #0284c7 100%);
      color: #030712;
      font-weight: 700;
      font-size: 14px;
      padding: 13px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      margin-top: 6px;
      transition: var(--transition);
    }
    .auth-btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    .auth-btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
    .auth-link {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
    .auth-alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-alert-danger {
      background: var(--sev-critical-bg);
      border: 1px solid var(--sev-critical-border);
      color: #fca5a5;
    }
    .auth-alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="{{ url_for('static', filename='js/firebase-auth.js') }}"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">iq</div>
        <h1 class="auth-title">Password Reset</h1>
        <p class="auth-subtitle">Enter your email to receive a recovery link</p>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form id="resetForm" class="auth-form">
        <div class="auth-input-group">
          <label class="auth-label" for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" class="auth-input" placeholder="security@enterprise.com" required autocomplete="email">
        </div>

        <button type="submit" id="resetSubmitBtn" class="auth-btn-primary">
          <span>SEND RECOVERY EMAIL</span>
        </button>
      </form>

      <div class="auth-footer">
        Remember your password?
        <a href="{{ url_for('auth.login_page') }}" class="auth-link">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const firebaseConfig = {{ firebase_config | tojson }};
      window.__FIREBASE_CONFIG__ = firebaseConfig;
      window.IqAuth.init(firebaseConfig);

      const alertEl = document.getElementById("authAlert");
      const resetForm = document.getElementById("resetForm");
      const submitBtn = document.getElementById("resetSubmitBtn");

      resetForm.addEventListener("submit", async function(e) {
        e.preventDefault();
        const email = document.getElementById("resetEmail").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        try {
          await window.IqAuth.resetPassword(email);
          alertEl.className = "auth-alert auth-alert-success";
          alertEl.textContent = "Password reset instructions have been sent to your email.";
          alertEl.style.display = "block";
          submitBtn.textContent = "EMAIL SENT";
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "SEND RECOVERY EMAIL";
          alertEl.className = "auth-alert auth-alert-danger";
          alertEl.textContent = window.IqAuth.formatErrorMessage(err);
          alertEl.style.display = "block";
        }
      });
    });
  </script>
</body>
</html>
